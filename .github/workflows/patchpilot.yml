# Forwards issues labelled "autofix" to the PatchPilot workflow on Rival CortexOne.
# Repo secrets: RIVAL_WEBHOOK_URL (workflow webhook URL), RIVAL_WEBHOOK_SECRET (signing secret).
name: PatchPilot autofix
on:
  issues:
    types: [labeled]
jobs:
  forward:
    if: github.event.label.name == 'autofix'
    runs-on: ubuntu-latest
    steps:
      - name: Send signed event to Rival
        env:
          URL: ${{ secrets.RIVAL_WEBHOOK_URL }}
          SECRET: ${{ secrets.RIVAL_WEBHOOK_SECRET }}
        run: |
          BODY=$(jq -cn --arg repo "${{ github.repository }}" --argjson n ${{ github.event.issue.number }} \
            --arg title "${{ github.event.issue.title }}" '{repo:$repo, issue_number:$n, title:$title}')
          SIG=$(printf %s "$BODY" | openssl dgst -sha256 -hmac "$SECRET" -hex | awk '{print $2}')
          curl -sS -X POST "$URL" -H "Content-Type: application/json" -H "X-Rival-Signature: $SIG" -d "$BODY"
